name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN. The gh-deploy push authenticates with a separate
# PAT (PAGES_DEPLOY_TOKEN) and checkout runs with persist-credentials: false, so
# the default token is only used to read the repo during checkout.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Configure git credentials
        run: git remote set-url origin https://x-access-token:${{ secrets.PAGES_DEPLOY_TOKEN }}@github.com/${{ github.repository }}

      - name: Build and deploy
        run: mkdocs gh-deploy --force
